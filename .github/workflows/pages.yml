# Builds the site from data/ and publishes it on GitHub Pages.
# Runs on every push, by hand from the Actions tab, and once a day so "Now on view" / "Upcoming" stay current.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # every day around 06:17 in Rome

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # SITE_BASE and SITE_URL are repository variables (Settings › Secrets and variables › Actions › Variables).
      # Preview: leave them unset. At launch: SITE_BASE=/  SITE_URL=https://www.spazioamanita.com  CNAME=www.spazioamanita.com
      - run: node scripts/build.mjs
        env:
          SITE_BASE: ${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          CNAME: ${{ vars.CNAME }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
